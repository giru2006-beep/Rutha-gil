<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUGI Custom Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f0f2f5;
            --primary: #10b981; /* Kijani ya Emerald - Tofauti na Bluu */
            --secondary: #334155; /* Slate */
            --card-white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--secondary);
        }

        /* Header ya Kipekee */
        .header-panel {
            background: linear-gradient(135deg, var(--secondary) 0%, #1e293b 100%);
            padding: 35px 20px;
            color: white;
            text-align: center;
            border-bottom: 4px solid var(--primary);
        }

        .header-panel h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Speed Optimization: Status Bar */
        .status-strip {
            background: var(--primary);
            color: white;
            font-size: 11px;
            padding: 5px;
            text-align: center;
            font-weight: bold;
        }

        /* Grid System */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 20px;
        }

        /* Modern Rounded Cards */
        .app-card {
            background: var(--card-white);
            padding: 20px 10px;
            border-radius: 25px; /* Round zaidi kuliko Tzlink */
            text-align: center;
            text-decoration: none;
            color: var(--secondary);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            transition: 0.2s ease-in-out;
            border: 1px solid transparent;
        }

        .app-card:active {
            transform: scale(0.95);
            border: 1px solid var(--primary);
        }

        .app-card i {
            font-size: 30px;
            color: var(--primary);
            margin-bottom: 10px;
            display: block;
        }

        .app-card span {
            font-size: 13px;
            font-weight: 600;
        }

        /* Main Login - Kitendo cha haraka */
        .login-strip {
            margin: 10px 20px;
            background: var(--secondary);
            color: white;
            padding: 18px;
            border-radius: 50px; /* Capsule shape */
            text-align: center;
            display: block;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .login-strip:active { background: #000; }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="header-panel">
        <h1>RUGI CONNECT</h1>
        <p style="font-size: 12px; opacity: 0.8; margin-top: 5px;">Secure Network Interface</p>
    </div>

    <div class="status-strip">
        <i class="fas fa-check-circle"></i> SYSTEM READY: 192.168.1.1
    </div>

    <div style="margin-top: 20px;">
        <a href="http://192.168.1.1/login.html" class="login-strip">
            <i class="fas fa-sign-in-alt"></i> ACCESS DASHBOARD
        </a>
    </div>

    <div class="dashboard-grid">
        <a href="http://192.168.1.1/login.html" class="app-card">
            <i class="fas fa-broadcast-tower"></i>
            <span>WiFi Setup</span>
        </a>

        <a href="http://192.168.1.1/login.html" class="app-card">
            <i class="fas fa-mobile-alt"></i>
            <span>Users</span>
        </a>

        <a href="http://192.168.1.1/login.html" class="app-card">
            <i class="fas fa-user-shield"></i>
            <span>Security</span>
        </a>

        <a href="http://192.168.1.1/login.html" class="app-card">
            <i class="fas fa-project-diagram"></i>
            <span>Network</span>
        </a>

        <a href="http://192.168.1.1/login.html" class="app-card">
            <i class="fas fa-comment-dots"></i>
            <span>Messages</span>
        </a>

        <a href="https://fast.com" class="app-card">
            <i class="fas fa-tachometer-alt"></i>
            <span>Speed Test</span>
        </a>
    </div>

    <footer>
        &copy; 2026 RuGI Private OS | Optimized for Speed
    </footer>

</body>
            </html>
